
<div class="container">
  




<label>Choisir un type :</label>

<select
  [(ngModel)]="nomCategorieSelectionnee"
  (change)="onChange()"
>
  <option value="">-- Choisir un type --</option>

  <option *ngFor="let categorie of categories"
          [value]="categorie.nomType">
    {{ categorie.nomType }}
  </option>
</select>



  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titre</th>
        <th>Auteur</th>
        <th>Prix</th>
        <th>Type</th>
      </tr>
    </thead>

    <tbody>
      @for (livre of livres; track livre.idLivre) {
        <tr>
          <td>{{ livre.idLivre }}</td>
          <td>{{ livre.titreLivre }}</td>
          <td>{{ livre.auteurLivre }}</td>
          <td>{{ livre.prixLivre }} DT</td>
          <td>{{ livre.type?.nomType }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucun livre trouvé.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
