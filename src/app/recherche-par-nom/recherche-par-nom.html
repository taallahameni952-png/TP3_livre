
<div class="container">
  <h2>Recherche par titre avec keyup</h2>

  <input
    type="text"
    class="form-control"
    #searchTerm
    (keyup)="onKeyUp(searchTerm.value)"
    placeholder="Saisir le titre du livre">

  <table class="table table-bordered mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Titre</th>
        <th>Auteur</th>
        <th>Prix</th>
        <th>Type</th>
      </tr>
    </thead>

    <tbody>
      @for (livre of livres; track livre.idLivre) {
        <tr>
          <td>{{ livre.idLivre }}</td>
          <td>{{ livre.titreLivre }}</td>
          <td>{{ livre.auteurLivre }}</td>
          <td>{{ livre.prixLivre }} DT</td>
          <td>{{ livre.type?.nomType }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">Aucun livre trouvé.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
